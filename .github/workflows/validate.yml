name: Validate DDC Finder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check catalogue/worker.js
          node --check catalogue-config.js
          node --check ddc-validation.js
          node --test tests/ddc-validation.test.cjs tests/catalogue-worker.test.mjs
          node --test tests/classification-engine.test.cjs
          node --test tests/catalogue-worker.test.mjs
          node --check tests/runner.js
          node --check tests/validate-data.mjs
      - name: Validate real-book test data
        run: node tests/validate-data.mjs
